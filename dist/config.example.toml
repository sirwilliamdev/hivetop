# hivetopd configuration: ~/.config/hivetop/config.toml
# Every key is optional. Saved changes are picked up within seconds.

# Sampling interval while the top-bar menu is open / closed, in milliseconds.
interval_active_ms = 2000
interval_idle_ms = 5000

[notify]
enabled = true
session_rss_mb = 4096      # warn when one Claude session uses more RAM than this
session_cpu_pct = 300.0    # ... or more CPU than this (100 = one full core)
session_cpu_secs = 60      # ... continuously for at least this long
psi_memory_some = 20.0     # warn on memory pressure (PSI "some" avg10, percent)
orphans = true             # warn when an ended session leaves work running
cooldown_secs = 600        # minimum time between two identical warnings

[history]
enabled = true
rollup_secs = 60           # one row per series per minute
retention_days = 30
downsample_after_days = 7  # older rows are merged into 10-minute rows
top_apps = 5               # apps recorded per minute, by memory

[docker]
enabled = true
# socket = "/var/run/docker.sock"   # default: $DOCKER_HOST (unix://) or this path
refresh_secs = 30          # container list refresh; usage is read every sample
